name: lyra-flutter

on:
  push:
    branches: [lyra-flutter]
    paths: ['lyra_flutter/**', '.github/workflows/lyra-flutter.yml']
  workflow_dispatch:

concurrency:
  group: lyra-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lyra_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (keeps lib/ untouched)
        run: |
          flutter --version
          flutter create . --platforms=android,ios,web --project-name lyra --org app.lyra --no-overwrite
          rm -f test/widget_test.dart

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true; tail -60 analyze.txt

      - name: Test
        run: flutter test > test.txt 2>&1 || true; tail -40 test.txt

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons

      - name: Screenshots
        working-directory: lyra_flutter/tool
        timeout-minutes: 14
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd ../build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          if [[ "$MSG" != *"[shots]"* ]]; then cp shots-quick.json shots.json; fi
          node shots.mjs
        env:
          MSG: ${{ github.event.head_commit.message }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            lyra_flutter/tool/shots/
            lyra_flutter/analyze.txt
            lyra_flutter/test.txt
          retention-days: 14

      - name: Gate (analyzer errors / failing tests)
        run: |
          if grep -q "error •" analyze.txt; then echo "analyzer errors"; grep "error •" analyze.txt | head -80; exit 1; fi
          if grep -q "Some tests failed" test.txt; then echo "tests failed"; exit 1; fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: lyra_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Pack platform folders (for committing back)
        run: tar czf platforms.tgz android ios web .metadata

      - uses: actions/upload-artifact@v4
        with:
          name: platforms
          path: lyra_flutter/platforms.tgz
          retention-days: 7
